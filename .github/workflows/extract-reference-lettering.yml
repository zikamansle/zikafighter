name: Extract SNES original title letter shapes
on:
  push:
    paths:
      - '.github/workflows/extract-reference-lettering.yml'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip -q install pillow
          python3 - <<'PY'
          import urllib.request,io
          from PIL import Image
          u='https://shattered-blog.com/wp-content/uploads/2016/07/blog-9.png'
          im=Image.open(io.BytesIO(urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read())).convert('RGB')
          print('SOURCE',im.size,flush=True)
          # Print title top line as a 1-bit golden-letter silhouette to locate individual tiles.
          w,h=im.size
          for rng in [(0,min(w,640),0,min(90,h)),(0,min(w,640),180,min(310,h))]:
            x0,x1,y0,y1=rng; cols=[]
            for x in range(x0,x1):
              hits=0
              for y in range(y0,y1):
                r,g,b=im.getpixel((x,y))
                if r>120 and g>95 and r>b*1.6 and g>b*1.2: hits+=1
              cols.append(hits)
            runs=[];start=None
            for i,v in enumerate(cols+[0]):
              if v>=2 and start is None:start=i
              if v<2 and start is not None:
                if i-start>=2:runs.append((start+x0,i-1+x0))
                start=None
            print('RANGE',rng,'RUNS',runs,flush=True)
          for y in range(10,75,2):
            line=''
            for x in range(0,w,2):
              hit=False
              for yy in (y,min(y+1,h-1)):
                for xx in (x,min(x+1,w-1)):
                  r,g,b=im.getpixel((xx,yy))
                  if r>120 and g>95 and r>b*1.6 and g>b*1.2:hit=True
              line+='#' if hit else ' '
            print('ROW',y,line.rstrip(),flush=True)
          PY