name: Inspect authentic SNES select font
on:
  push:
    paths:
      - '.github/workflows/inspect-snes-font.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SNES original sprite sheet and inspect lettering pixels
        shell: bash
        run: |
          python3 -m pip -q install pillow
          python3 - <<'PY'
          import urllib.request,io
          from PIL import Image
          urls=[
            "https://www.spriters-resource.com/media/assets/78/80834.png?updated=1755474472",
            "https://www.spriters-resource.com/media/assets/6/5573.png?updated=1755472423",
            "https://static.wixstatic.com/media/685632_531e2c5c545244bb82df966c634c1800~mv2.png",
            "https://static.wixstatic.com/media/685632_0fee1909f2e04b08aa3ede8c582e66f9~mv2.png",
            "https://www.nintendoworldreport.com/media/27386/4/1.jpg",
            "https://thekingofgrabs.files.wordpress.com/2018/02/street-fighter-2-turbo-hyper-fighting-snes-08.png",
            "https://shattered-blog.com/wp-content/uploads/2016/07/blog-9.png",
            "https://images.weserv.nl/?url=www.spriters-resource.com/media/assets/78/80834.png",
          ]
          for i,url in enumerate(urls):
            print("SOURCE",i,url,flush=True)
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Referer":"https://www.spriters-resource.com/"})
              with urllib.request.urlopen(req,timeout=20) as r: raw=r.read()
              im=Image.open(io.BytesIO(raw)).convert("RGB")
              print("OK",len(raw),"dimensions",im.size,flush=True)
            except Exception as exc:
              print("ERROR",str(exc),flush=True)
              continue
            if i not in [3,4,5,6,7,8]:continue
            # 1000-pixel web preview displays a 1596px original.
            # Look around lines containing PLAYER SELECT and STAGE SELECT.
            if i!=8:continue
            for x0,y0,w,h in [(465,470,155,36),(465,550,180,100)]:
              patch=im.crop((x0,y0,x0+w,y0+h))
              print("PATCH",x0,y0,w,h)
              for y in range(0,h):
                line=""
                for x in range(w):
                  r,g,b=patch.getpixel((x,y))
                  # Yellow or orange SNES lettering, away from blue background.
                  if r>110 and r>g*1.1 and r>b*1.5: line+="#"
                  elif r>140 and g>120 and b<110:line+="+"
                  elif r>160 and g>160 and b>160:line+="o"
                  elif g>75 and b>90 and r<100:line+="."
                  else:line+=" "
                if "#" in line or "+" in line or "o" in line:print(f"{y0+y:04d}|{line.rstrip()}",flush=True)
          PY
