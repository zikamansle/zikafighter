name: Recreate each Pascal sprite individually v92
on:
  push:
    branches: [main]
    paths:
      - "tools/recreate_pascal_individual_v92.py"
      - ".github/workflows/recreate-pascal-v92.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pascal-recreate-v92
  cancel-in-progress: false
jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Render 316 independent original PNG and 316 blue PNG
        run: python tools/recreate_pascal_individual_v92.py
      - name: Validate all new individual assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/fighters/pascal/v92')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          a=json.loads((root/'render-audit.json').read_text(encoding='utf-8'))
          assert m['revision']=='v92' and len(a['frames'])==316
          assert m['total']==632 and len(m['counts'])==44
          for pal in ('original','bleu'):
            assert len(list((root/pal).glob('*/*.png')))==316
          for p in (root/'original').glob('*/*.png'):
            b=root/'bleu'/p.relative_to(root/'original')
            with Image.open(p) as x,Image.open(b) as y:
              assert x.size==y.size==(256,256)
              assert x.getchannel('A').tobytes()==y.getchannel('A').tobytes()
          print('PASSED: 632 individual Pascal PNG; fixed scale, verified alpha alignment.')
          PY
      - name: Commit new individual PNG and audit without deleting old sprites
        run: |
          git config user.name "Zika Fighter sprite creator"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal/v92 assets/fighters/pascal/manifest.json
          git commit -m "v92: create 632 individually rendered Pascal sprite PNGs"
          git pull --rebase origin main
          git push origin HEAD:main
