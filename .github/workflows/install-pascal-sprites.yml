name: Installer les sprites Pascal dans Zika Fighter
on:
  push:
    paths:
      - '.github/workflows/install-pascal-sprites.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pascal-sprites-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Retrieve Zika Fighter source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Pascal individual PNG sprites
        env:
          PACK_URL: https://bd98605c-3058-4728-b28a-0b55031d7cbc.usrfiles.com/archives/685632_ca0a7f22af184b4ca1e6e9ca1eb38b03.zip
        run: |
          python - <<'PY'
          import os, re, json, zipfile, urllib.request
          from pathlib import Path
          url=os.environ["PACK_URL"]
          req=urllib.request.Request(url,headers={"User-Agent":"ZikaFighter-PascalSpriteInstaller/1.0"})
          blob=urllib.request.urlopen(req,timeout=90).read()
          if len(blob)>80_000_000: raise RuntimeError("Archive trop lourde.")
          archive=Path("/tmp/pascal.zip")
          archive.write_bytes(blob)
          groups={}
          target=Path("assets/fighters/pascal")
          with zipfile.ZipFile(archive) as z:
            for name in z.namelist():
              match=re.search(r"/sprites/original/([a-z0-9_]+)/(\d{2})\.png$",name)
              if not match: continue
              category,index=match.group(1),int(match.group(2))
              data=z.read(name)
              if not data.startswith(b"\x89PNG\r\n\x1a\n"): raise RuntimeError(f"PNG invalide: {name}")
              output=target/"original"/category/f"{index:02d}.png"
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(data)
              groups.setdefault(category,[]).append(index)
          if sum(map(len,groups.values()))!=316 or len(groups)!=44:
            raise RuntimeError(f"Pack inattendu : {len(groups)} animations, {sum(map(len,groups.values()))} images (attendu 44/316).")
          counts={}
          for name,indices in groups.items():
            indices=sorted(indices)
            if indices!=list(range(1,len(indices)+1)):
              raise RuntimeError(f"Frames manquantes ou doublées : {name}")
            counts[name]=len(indices)
          (target/"manifest.json").write_text(json.dumps({
            "character":"Pascal","canvas":[256,256],
            "anchor":[128,227],"palette":"original",
            "counts":counts,"total_frames":sum(counts.values()),
            "source":"ZikaFighter_Pascal_TAILLE_UNIFORME_JEU.zip",
            "normalized": True,
            "status":"échelle de combat harmonisée, contrôle visuel restant"
          },ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          with zipfile.ZipFile(archive) as z:
            reports=[x for x in z.namelist() if x.endswith('/manifest.json')]
            if len(reports)!=1: raise RuntimeError("Rapport technique introuvable.")
            m=json.loads(z.read(reports[0]))
            if m.get('canvas') != [256,256] or len(m.get('frames',{})) != 316:
              raise RuntimeError("Sprites non normalisés ou rapport invalide.")
            (target/"normalisation.json").write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print(f"OK : {len(groups)} animations / {sum(counts.values())} PNG uniformisés.")
          PY

      - name: Commit Pascal sprite images
        run: |
          git config user.name "Zika Fighter sprite importer"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Pascal fighter size and anchor across all 316 frames"
            git push origin HEAD:main
          fi

      - name: Verify Pascal PNG and animation loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('assets/fighters/pascal')
          data=json.loads((root/'manifest.json').read_text(encoding='utf8'))
          assert data['character']=='Pascal' and data.get('normalized') is True
          assert len(data['counts'])==44 and sum(data['counts'].values())==316
          for pose,n in data['counts'].items():
            for i in range(1,n+1):
              f=root/'original'/pose/f'{i:02d}.png'
              b=f.read_bytes()
              assert b[:8]==bytes((137,80,78,71,13,10,26,10)),str(f)
              assert struct.unpack('>II',b[16:24])==(256,256),str(f)
          report=json.loads((root/'normalisation.json').read_text(encoding='utf8'))
          assert len(report['frames'])==316
          print('Pascal OK: 316 sprites PNG 256x256, 44 animations normalisées.')
          PY
          node --check pascal-animation.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy updated game
        id: deployment
        uses: actions/deploy-pages@v4
