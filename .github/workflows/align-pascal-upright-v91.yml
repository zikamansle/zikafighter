name: Align Pascal upright sprite height v91
on:
  push:
    branches: [main]
    paths:
      - "tools/align_pascal_upright_v91.py"
      - ".github/workflows/align-pascal-upright-v91.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pascal-upright-v91
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Align head/feet without changing Pascal appearance
        run: python tools/align_pascal_upright_v91.py
      - name: Check 632 source PNG and animation behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/fighters/pascal')
          m=json.loads((root/'manifest.json').read_text())
          a=json.loads((root/'upright_geometry_v91_audit.json').read_text())
          assert m['uprightSizeRevision']=='v91'
          assert m['uprightCorrectedFrames']==a['changedFramesPerPalette']>0
          for palette in ('original','bleu'):
            assert len(list((root/palette).glob('*/*.png')))==316
          for file in (root/'original').glob('*/*.png'):
            with Image.open(file) as x,Image.open(root/'bleu'/file.relative_to(root/'original')) as y:
              assert x.size==y.size==(256,256)
              assert x.getchannel('A').tobytes()==y.getchannel('A').tobytes()
          print('PASS: 632 PNG palettes and upper body heights aligned')
          PY
          node tests/pascal-scale-v87.mjs
          node --check pascal-animation.js
      - name: Commit aligned source frames
        run: |
          git config user.name "Zika Fighter geometry QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal
          if ! git diff --cached --quiet; then
            git commit -m "v91: align Pascal upright sprite head and foot positions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
