name: Publish verified static game
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-static-game.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-game-recovery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game and sprite renderer
        run: |
          node tests/combat-v85.mjs
          node tests/pascal-scale-v87.mjs
          node tests/pascal-v94.mjs
          node tests/pascal-bloc1.mjs
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const src=fs.readFileSync('pascal-animation.js','utf8');
          assert(!src.includes('poseScale'),'Per-pose zoom must not return');
          const m=JSON.parse(fs.readFileSync('assets/fighters/pascal/manifest.json'));
          assert.equal(m.geometryRevision,'v88');
          assert.equal(m.crouchRevision,'v88');
          assert.equal(m.uprightSizeRevision,'v91');
          assert.equal(m.uprightCorrectedFrames,29);
          const next=JSON.parse(fs.readFileSync('assets/fighters/pascal/v94/manifest.json'));
          assert.equal(next.revision,'v94');
          assert.equal(Object.values(next.counts).reduce((sum,n)=>sum+n,0),316);
          assert(src.includes("const spriteRoot="),'Missing Pascal renderer path');
          assert(src.includes("get('pascal')!=='preview-v94'"),'Incomplete v94 must not be the default Pascal pack');
          assert(src.includes("if(f.health<=0)return f.y<754?"),'KO pop during flight must be prevented');
          assert(src.includes("const stable=pose==='saut_neutre'"),'stable airborne frames required');
          JS
      - name: Package game files without transforming intros or images
        run: |
          mkdir _site
          cp *.html *.js *.css _site/
          cp -a assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Stop competing legacy Pages publications on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed") | .id')
            if [ -z "$ids" ]; then break; fi
            for id in $ids; do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
            done
            sleep 5
          done
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment" and .status != "completed")] | length')
          test "$remaining" = 0
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA"
      - name: Deploy static game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
      - name: Verify public renderer and corrected sprite
        run: |
          base="https://zikamansle.github.io/zikafighter"
          for attempt in $(seq 1 12); do
            curl -fsSL "$base/pascal-animation.js?verify=$GITHUB_SHA-$attempt" -o /tmp/public-pascal.js || true
            if cmp -s pascal-animation.js /tmp/public-pascal.js; then
              curl -fsSL "$base/index.html?verify=$GITHUB_SHA-$attempt" -o /tmp/public-index.html
              curl -fsSL "$base/assets/fighters/pascal/v94/manifest.json?verify=$GITHUB_SHA-$attempt" -o /tmp/public-manifest.json
              curl -fsSL "$base/assets/fighters/pascal/v94/original/marche_avant/01.png?verify=$GITHUB_SHA-$attempt" -o /tmp/public-walk.png
              curl -fsSL "$base/assets/fighters/pascal/v94/original/garde_accroupie/01.png?verify=$GITHUB_SHA-$attempt" -o /tmp/public-crouch.png
              cmp index.html /tmp/public-index.html
              cmp assets/fighters/pascal/v94/manifest.json /tmp/public-manifest.json
              cmp assets/fighters/pascal/v94/original/marche_avant/01.png /tmp/public-walk.png
              cmp assets/fighters/pascal/v94/original/garde_accroupie/01.png /tmp/public-crouch.png
              curl -fsSL "$base/assets/fighters/pascal/bloc1/original/attente/01.png?verify=$GITHUB_SHA-$attempt" -o /tmp/public-bloc1-idle.png
              curl -fsSL "$base/assets/fighters/pascal/bloc1/original/garde_debout/04.png?verify=$GITHUB_SHA-$attempt" -o /tmp/public-bloc1-guard.png
              cmp assets/fighters/pascal/bloc1/original/attente/01.png /tmp/public-bloc1-idle.png
              cmp assets/fighters/pascal/bloc1/original/garde_debout/04.png /tmp/public-bloc1-guard.png
              exit 0
            fi
            sleep 5
          done
          echo "Public files do not match deployed game"
          exit 1
