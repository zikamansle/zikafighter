name: Pascal full proportion diagnostics v91
on:
  push:
    branches: [main]
    paths:
      - "tools/audit_pascal_dimensions_v91.py"
      - ".github/workflows/audit-pascal-v91.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pascal-audit-v91
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/audit_pascal_dimensions_v91.py
      - name: Commit diagnostic only
        run: |
          git config user.name "Zika Fighter QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal/full_dimension_audit_v91.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit Pascal proportions across all 316 source frames"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
