name: Verify authentic SFII font packages
on:
  push:
    paths:
      - '.github/workflows/probe-sfii-fonts.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check real font package availability (no fonts are uploaded)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for n,url in [
            ('SFII_LARGE_WOFF2','https://fontstruct.com/font_archives/download/2467222/woff2'),
            ('SFII_LARGE_OTF','https://fontstruct.com/font_archives/download/2467222/otf'),
            ('CAPCOM_SERIF_WOFF2','https://fontstruct.com/font_archives/download/821406/woff2'),
            ('SFII_FONTS_SITE','https://fontstruct.com/fontstructions/download/2467222'),
          ]:
            try:
              req=urllib.request.Request(url,headers={
                 'User-Agent':'Mozilla/5.0',
                 'Referer':'https://fontstruct.com/fontstructions/download/2467222',
                 'Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=12) as r:
                data=r.read(150)
                print(n,'status',r.status,'content-type',r.headers.get('Content-Type'),'sample',repr(data[:35]),flush=True)
            except Exception as e:print(n,'error',type(e).__name__,str(e)[:160],flush=True)
          PY