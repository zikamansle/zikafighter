name: Inspect font licenses and actual font packages
on:
  push:
    paths:
      - '.github/workflows/probe-sfii-fonts.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download archive metadata and bundled font licenses
        run: |
          python3 - <<'PY'
          import urllib.request,zipfile,io
          fonts={
           'Capcom Serif Large':821406,
           'CPS-1 Fighter':1525503,
           'Street Fighter II Large':2467222,
           '16-bit Battle':2298559,
          }
          for name,number in fonts.items():
            url=f'https://fontstruct.com/font_archives/download/{number}/woff2'
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              data=urllib.request.urlopen(req,timeout=30).read()
              z=zipfile.ZipFile(io.BytesIO(data))
              print('FONT:',name,'BYTES:',len(data),'FILES:',[(x.filename,x.file_size) for x in z.infolist()],flush=True)
              for f in z.namelist():
                if any(a in f.lower() for a in ('license','readme','licence')):
                  txt=z.read(f).decode('utf8','replace')[:2500]
                  print('LICENSE',name,f,repr(txt),flush=True)
            except Exception as e:print('ERROR',name,str(e),flush=True)
          PY