name: Correct the six measured Pascal size outliers v90
on:
  push:
    branches: [main]
    paths:
      - "tools/fix_pascal_size_v90.py"
      - ".github/workflows/pascal-size-v90.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pascal-size-v90
  cancel-in-progress: false
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - name: Correct only measured Pascal profile and jump size errors
        run: python tools/fix_pascal_size_v90.py
      - name: Confirm all PNGs and original blue silhouettes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('assets/fighters/pascal')
          m=json.loads((root/'manifest.json').read_text())
          a=json.loads((root/'size_audit_v90.json').read_text())
          assert m['sizeCorrectionRevision']=='v90'
          assert len(a['corrected'])==m['sizeCorrectedFrames']==6
          for p in ['original','bleu']:
            assert len(list((root/p).glob('*/*.png')))==316
          for p in (root/'original').glob('*/*.png'):
            q=root/'bleu'/p.relative_to(root/'original')
            with Image.open(p) as x,Image.open(q) as y:
              assert x.size==y.size==(256,256)
              assert x.getchannel('A').tobytes()==y.getchannel('A').tobytes()
          print('PASS — 12 localized PNG corrections, 632 valid original frames')
          PY
      - name: Commit adjusted PNGs and QA report to main
        run: |
          git config user.name "Zika Fighter sprite QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal
          if ! git diff --cached --quiet; then
            git commit -m "v90: normalize six Pascal walking and jumping silhouette outliers"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
