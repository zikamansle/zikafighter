name: Build Pascal block 1 preview sprites
on:
  push:
    branches: [main]
    paths:
      - "tools/build_pascal_bloc1.py"
      - ".github/workflows/build-pascal-bloc1.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pascal-bloc1-qa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sprite renderer dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Create independent idle and upright guard PNG from approved master
        run: python tools/build_pascal_bloc1.py
      - name: Test every sprite and palette
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json
          p=Path('assets/fighters/pascal/bloc1')
          m=json.loads((p/'manifest.json').read_text(encoding='utf8'))
          qa=json.loads((p/'qa.json').read_text(encoding='utf8'))
          assert m['status'].endswith('USER TEST REQUIRED')
          assert m['spritesPerPalette']==12 and len(qa)==12
          assert len(set(x['sourceHash'] for x in qa))==12
          for pal in ('original','bleu'):
            files=sorted((p/pal).glob('*/*.png'))
            assert len(files)==12
            for f in files:
              with Image.open(f) as im: assert im.size==(256,256)
          for f in (p/'original').glob('*/*.png'):
            with Image.open(f) as x, Image.open(p/'bleu'/f.relative_to(p/'original')) as y:
              assert x.getchannel('A').tobytes()==y.getchannel('A').tobytes()
          assert (p/'ombre_sol.png').exists()
          print('QA PASS: all 24 preview PNG + shadow')
          PY
      - name: Commit test sprites, preserving old game art
        run: |
          git config user.name "Zika Fighter Pascal QA"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/fighters/pascal/bloc1
          if ! git diff --cached --quiet; then
            git commit -m "Pascal bloc 1: 12 independently rendered idle/guard test frames plus palette and shadow"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
