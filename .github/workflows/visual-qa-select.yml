name: Visual QA - Street Fighter fonts in every screen
on:
  push:
    paths:
      - '.github/workflows/visual-qa-select.yml'
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Screenshot real 4:3 screens
        run: |
          python3 -m http.server 8765 >/tmp/zkserver.log 2>&1 &
          sleep 2
          mkdir -p assets/qa
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:1240,height:960},deviceScaleFactor:1});
            page.on('console',m=>{if(m.type()==='error')console.log('BROWSER ERROR',m.text())});
            page.on('pageerror',e=>console.log('JS ERROR',e.message));
            async function open(url){
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1500);
              return page;
            }
            const base='http://127.0.0.1:8765/';
            await open(base);
            await page.waitForFunction(()=>!!(window.ZikaFighterCharacterSelect&&window.ZikaSNESText),null,{timeout:22000});
            const fontStatus=await page.evaluate(async()=>{
              await Promise.all([document.fonts.load('18px "ZikaCPS1"'),document.fonts.load('18px "ZikaSFII"')]);
              return {cps:document.fonts.check('18px "ZikaCPS1"'),
                      sfii:document.fonts.check('18px "ZikaSFII"'),
                      ready:window.ZikaSNESText.ready,
                      faces:[...document.fonts].map(f=>({family:f.family,status:f.status}))};
            });
            console.log('FONT STATUS',JSON.stringify(fontStatus));
            if(!fontStatus.cps||!fontStatus.sfii||!fontStatus.ready)throw Error('SFII font faces not loaded');
            await page.evaluate(()=>{
              document.getElementById('zf-intro')?.remove();
              document.documentElement.classList.add('zf-intro-booted');
              window.ZikaFighterCharacterSelect.open();
            });
            await page.waitForTimeout(1800);
            await page.locator('#select').screenshot({path:'assets/qa/select.png'});
            console.log('SELECT COUNTS',JSON.stringify(await page.evaluate(()=>({
              portraitCount:document.querySelectorAll('.zf-fighter-slot').length,
              stagesCount:document.querySelectorAll('.zf-stage-slot').length,
              introExists:!!document.getElementById('zf-intro')
            }))));
            await page.evaluate(()=>window.ZikaFighterStageSelect.open({player1:'pascal',player2:'micka',twoPlayers:false}));
            await page.waitForTimeout(900);
            await page.locator('#select').screenshot({path:'assets/qa/stages.png'});
            for(const [name,seconds] of [
              ['intro-small',.60],['intro-sweep',1.70],
              ['intro-pixel',2.42],['intro-rotation',2.86],
              ['intro-stabilize',3.57]
            ]){
              await open(base+'?screen=cinematic&t='+seconds);
              await page.waitForTimeout(300);
              await page.locator('#zf-cinematic-canvas').screenshot({path:'assets/qa/'+name+'.png'});
              console.log('CINEMATIC',name,await page.evaluate(()=>({
                canvasBackground:getComputedStyle(document.querySelector('#zf-cinematic')).backgroundColor,
                phaseCanvas:document.querySelector('#zf-cinematic-canvas')?.getAttribute('width')
              })));
            }
            await open(base+'?screen=press');
            await page.locator('#zf-title-canvas').screenshot({path:'assets/qa/press-start.png'});
            await open(base+'?screen=title');
            await page.locator('#zf-title-canvas').screenshot({path:'assets/qa/title-turbo.png'});
            await page.keyboard.press('ArrowDown');
            await page.waitForTimeout(300);
            await page.locator('#zf-title-canvas').screenshot({path:'assets/qa/title-normal.png'});
            await open(base+'?screen=title');
            await page.locator('#zf-title-canvas').screenshot({path:'assets/qa/title.png'});
            await open(base+'?screen=options');
            await page.locator('#zf-options-canvas').screenshot({path:'assets/qa/options.png'});
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          JS
      - name: Store temporary previews for manual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/qa
          git commit -m "Visual QA screenshots of 30fps logo sweep and rotation"
          git pull --rebase origin main
          git push origin HEAD:main
